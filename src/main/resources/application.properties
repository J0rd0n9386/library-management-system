# ===================================
# Application Info
# ===================================
spring.application.name=library-management

# ===================================
# MySQL Database Connection
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/library_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Ankit@7488090887
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===================================
# JPA / Hibernate Config
# ===================================
# ddl-auto: update = tables auto create/update hongi entity ke basis pe
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Dialect line yahan se hata di gayi - Hibernate 7.x khud auto-detect kar leta hai
# connection URL se (com.mysql.cj.jdbc.Driver dekh ke). MySQL8Dialect class
# naye Hibernate version me exist nahi karti, isliye ClassNotFoundException aa raha tha.

# ===================================
# Server Port (optional, default 8080 hai)
# ===================================
server.port=8081

# ===================================
# Logging (debugging ke liye helpful)
# ===================================
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG